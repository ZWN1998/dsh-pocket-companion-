name: 构建口袋 DSH APK

on:
  # 手动触发：在 Actions 页面点 Run workflow
  workflow_dispatch:
  # 推送代码到 main/master 时自动构建
  push:
    branches: [main, master]
    paths:
      - 'packages/mobile-app/flutter/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 检查 Flutter 环境
        run: flutter --version && java -version

      - name: 备份自定义 AndroidManifest
        working-directory: packages/mobile-app/flutter
        run: cp android/app/src/main/AndroidManifest.xml AndroidManifest.custom.xml

      - name: 补齐 Android 脚手架
        working-directory: packages/mobile-app/flutter
        run: |
          rm -rf android
          flutter create --org com.dshpocket --project-name dshpocket --platforms=android .

      - name: 恢复自定义 manifest（含 dshpocket:// 深链）
        working-directory: packages/mobile-app/flutter
        run: cp AndroidManifest.custom.xml android/app/src/main/AndroidManifest.xml

      - name: 提高 compileSdk 到 37（部分插件传递依赖要求 37）
        working-directory: packages/mobile-app/flutter
        run: |
          echo "flutter.compileSdkVersion=37" >> android/gradle.properties
          echo "flutter.targetSdkVersion=37" >> android/gradle.properties
          cat android/gradle.properties

      - name: 全局禁用 lintVital（规避 Flutter 3.50 + AGP 的 Android Lint 内部崩溃）
        # Flutter 3.50 用 Kotlin DSL，且崩溃发生在依赖模块的 lintVital 任务；
        # 用全局 init.gradle 在任务图就绪时禁用所有 lintVital*，绕开具体文件名与模块层级。
        run: |
          mkdir -p "$HOME/.gradle"
          echo 'gradle.taskGraph.whenReady { g -> g.allTasks.findAll { it.name.startsWith("lintVital") }.each { it.enabled = false } }' > "$HOME/.gradle/init.gradle"
          cat "$HOME/.gradle/init.gradle"

      - name: 拉取依赖
        working-directory: packages/mobile-app/flutter
        run: flutter pub get

      - name: 构建 Release APK
        working-directory: packages/mobile-app/flutter
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dshpocket-release-apk
          path: packages/mobile-app/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
