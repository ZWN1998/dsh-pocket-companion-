name: 构建口袋 DSH APK

on:
  # 手动触发：在 Actions 页面点 Run workflow
  workflow_dispatch:
  # 推送代码到 main/master 时自动构建
  push:
    branches: [main, master]
    paths:
      - 'packages/mobile-app/flutter/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 检查 Flutter 环境
        run: flutter --version && java -version

      - name: 备份自定义 AndroidManifest
        working-directory: packages/mobile-app/flutter
        run: cp android/app/src/main/AndroidManifest.xml AndroidManifest.custom.xml

      - name: 补齐 Android 脚手架
        working-directory: packages/mobile-app/flutter
        run: |
          rm -rf android
          flutter create --org com.dshpocket --project-name dshpocket --platforms=android .

      - name: 恢复自定义 manifest（含 dshpocket:// 深链）
        working-directory: packages/mobile-app/flutter
        run: cp AndroidManifest.custom.xml android/app/src/main/AndroidManifest.xml

      - name: 拉取依赖
        working-directory: packages/mobile-app/flutter
        run: flutter pub get

      - name: 构建 Release APK
        working-directory: packages/mobile-app/flutter
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dshpocket-release-apk
          path: packages/mobile-app/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
